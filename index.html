
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BuildingBlocks</title>
    <meta name="description" content="A high-performance, mobile-optimized retro-neon falling blocks puzzle game with AI game strategist, PWA support, and pilot profile tracking.">
    <meta name="theme-color" content="#050505">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="BuildingBlocks">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="icon" type="image/svg+xml" href="/icon.svg">
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png">
    <link rel="manifest" href="/manifest.webmanifest">
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then((reg) => console.log('SW active:', reg.scope))
            .catch((err) => console.warn('SW registration:', err));
        });
      }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Press+Start+2P&family=Inter:wght@400;600;800&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #050505;
            color: white;
            overflow: hidden;
            touch-action: none;
        }

        .font-orbitron { font-family: 'Orbitron', sans-serif; }
        .font-retro { font-family: 'Press Start 2P', cursive; }

        /* CRT Scanline Overlay */
        body::after {
          content: " ";
          display: block;
          position: fixed;
          top: 0;
          left: 0;
          bottom: 0;
          right: 0;
          background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%), 
                      linear-gradient(90deg, rgba(255, 0, 0, 0.04), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.04));
          z-index: 1000;
          background-size: 100% 4px, 3px 100%;
          pointer-events: none;
        }

        .neon-border-gold { box-shadow: 0 0 15px rgba(234, 179, 8, 0.3), inset 0 0 5px rgba(234, 179, 8, 0.3); border-color: rgba(234, 179, 8, 0.5); }
        .neon-border-pink { box-shadow: 0 0 15px rgba(236, 72, 153, 0.3), inset 0 0 5px rgba(236, 72, 153, 0.3); border-color: rgba(236, 72, 153, 0.5); }
        .neon-border-purple { box-shadow: 0 0 15px rgba(168, 85, 247, 0.3), inset 0 0 5px rgba(168, 85, 247, 0.3); border-color: rgba(168, 85, 247, 0.5); }

        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }

        .animated-grid {
          position: fixed;
          width: 200vw;
          height: 200vh;
          top: -50%;
          left: -50%;
          background-image: linear-gradient(rgba(168, 85, 247, 0.05) 1px, transparent 1px),
                            linear-gradient(90deg, rgba(168, 85, 247, 0.05) 1px, transparent 1px);
          background-size: 80px 80px;
          transform: rotateX(60deg);
          animation: grid-scroll 30s linear infinite;
          z-index: -1;
        }
        @keyframes grid-scroll {
          from { background-position: 0 0; }
          to { background-position: 0 80px; }
        }

        /* Block effects */
        .block-gloss {
          background: linear-gradient(135deg, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0) 50%);
        }

        @keyframes shake {
          0% { transform: translate(1px, 1px) rotate(0deg); }
          10% { transform: translate(-1px, -2px) rotate(-1deg); }
          20% { transform: translate(-3px, 0px) rotate(1deg); }
          30% { transform: translate(3px, 2px) rotate(0deg); }
          40% { transform: translate(1px, -1px) rotate(1deg); }
          50% { transform: translate(-1px, 2px) rotate(-1deg); }
          60% { transform: translate(-3px, 1px) rotate(0deg); }
          70% { transform: translate(3px, 1px) rotate(-1deg); }
          80% { transform: translate(-1px, -1px) rotate(1deg); }
          90% { transform: translate(1px, 2px) rotate(0deg); }
          100% { transform: translate(1px, -2px) rotate(-1deg); }
        }
        .animate-shake {
          animation: shake 0.5s;
          animation-iteration-count: 1;
        }
    </style>
